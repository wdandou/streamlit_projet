# This is a basic workflow that is manually triggered
name: Pull from Hugging Face
- name: Pull from Hugging Face
  env:
    HF_TOKEN: ${{ secrets.HF_TOKEN }}
  run: |
    git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/wdandou/streamlit_projet
    git pull space main --rebase --allow-unrelated-histories
